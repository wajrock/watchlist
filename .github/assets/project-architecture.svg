  <rect x="320" y="220" width="260" height="90" rx="12" fill="#5c2424" stroke="#8a3a3a" stroke-width="1.5" />
  <text x="450" y="258" fill="#ffd6d6" font-size="21" font-weight="700" text-anchor="middle">Secret Manager</text>
