<div class="avatar" routerLink="/profile" replaceUrl="true">
    <div class="avatar-pp">{{ initialsLoggedUser() }}</div>
    @let watchlistInvitations = this.watchlistInvitations();
    @if (showBadge() && watchlistInvitations && watchlistInvitations.length > 0) {
        <div class="invitations-badge">{{ watchlistInvitations.length }}</div>
    }
</div>
