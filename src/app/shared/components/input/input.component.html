<div class="input">
    <input
        #usernameInput
        [type]="type()"
        [name]="name()"
        [id]="id()"
        [placeholder]="placeholder()"
        [value]="value()"
        [spellcheck]="spellcheck()"
        [autocapitalize]="autocapitalize() ? 'on' : 'off'"
        [disabled]="disabled()"
        [class.error]="hasErrorMessage()"
        [autocomplete]="autocomplete()"
        (input)="onInput.emit($event)"
    />
</div>
