<main class="page search-wrapper">
    <div class="search-wrapper-overlay"></div>
    <div class="search-header">
        <app-button customClass="btn-default" (action)="closeSearchPage()"
            ><i class="fa-solid fa-arrow-left"></i
        ></app-button>
        <div class="searchbar" [class.active]="isSearchActive" #searchBar>
            <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 20 20"
                fill="none"
                class="searchbar-icon"
            >
                <path
                    d="M17.5 17.5L13.875 13.875M15.8333 9.16667C15.8333 12.8486 12.8486 15.8333 9.16667 15.8333C5.48477 15.8333 2.5 12.8486 2.5 9.16667C2.5 5.48477 5.48477 2.5 9.16667 2.5C12.8486 2.5 15.8333 5.48477 15.8333 9.16667Z"
                    stroke="currentColor"
                    stroke-width="1.66667"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
            <input
                #searchInput
                type="search"
                inputmode="search"
                autocomplete="off"
                autocapitalize="off"
                name=""
                id=""
                placeholder="On regarde quoi ?"
                [(ngModel)]="value"
                (ngModelChange)="onSearchChange($event)"
                (focus)="isSearchActive = true"
                (blur)="isSearchActive = false"
            />
            @if (value.length > 0) {
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 20 20"
                    fill="none"
                    class="searchbar-clear"
                    (click)="clearSearch()"
                >
                    <path
                        d="M10 0.25C8.07164 0.25 6.18657 0.821828 4.58319 1.89317C2.97982 2.96452 1.73013 4.48726 0.992179 6.26884C0.254225 8.05042 0.061142 10.0108 0.437348 11.9021C0.813554 13.7934 1.74215 15.5307 3.10571 16.8943C4.46928 18.2579 6.20656 19.1865 8.09787 19.5627C9.98919 19.9389 11.9496 19.7458 13.7312 19.0078C15.5127 18.2699 17.0355 17.0202 18.1068 15.4168C19.1782 13.8134 19.75 11.9284 19.75 10C19.7473 7.41498 18.7192 4.93661 16.8913 3.10872C15.0634 1.28084 12.585 0.25273 10 0.25ZM13.5306 12.4694C13.6003 12.5391 13.6556 12.6218 13.6933 12.7128C13.731 12.8039 13.7504 12.9015 13.7504 13C13.7504 13.0985 13.731 13.1961 13.6933 13.2872C13.6556 13.3782 13.6003 13.4609 13.5306 13.5306C13.4609 13.6003 13.3782 13.6556 13.2872 13.6933C13.1961 13.731 13.0986 13.7504 13 13.7504C12.9015 13.7504 12.8039 13.731 12.7128 13.6933C12.6218 13.6556 12.5391 13.6003 12.4694 13.5306L10 11.0603L7.53063 13.5306C7.46095 13.6003 7.37822 13.6556 7.28718 13.6933C7.19613 13.731 7.09855 13.7504 7 13.7504C6.90146 13.7504 6.80388 13.731 6.71283 13.6933C6.62179 13.6556 6.53906 13.6003 6.46938 13.5306C6.3997 13.4609 6.34442 13.3782 6.30671 13.2872C6.269 13.1961 6.24959 13.0985 6.24959 13C6.24959 12.9015 6.269 12.8039 6.30671 12.7128C6.34442 12.6218 6.3997 12.5391 6.46938 12.4694L8.93969 10L6.46938 7.53063C6.32865 7.38989 6.24959 7.19902 6.24959 7C6.24959 6.80098 6.32865 6.61011 6.46938 6.46937C6.61011 6.32864 6.80098 6.24958 7 6.24958C7.19903 6.24958 7.3899 6.32864 7.53063 6.46937L10 8.93969L12.4694 6.46937C12.5391 6.39969 12.6218 6.34442 12.7128 6.3067C12.8039 6.26899 12.9015 6.24958 13 6.24958C13.0986 6.24958 13.1961 6.26899 13.2872 6.3067C13.3782 6.34442 13.4609 6.39969 13.5306 6.46937C13.6003 6.53906 13.6556 6.62178 13.6933 6.71283C13.731 6.80387 13.7504 6.90145 13.7504 7C13.7504 7.09855 13.731 7.19613 13.6933 7.28717C13.6556 7.37822 13.6003 7.46094 13.5306 7.53063L11.0603 10L13.5306 12.4694Z"
                        fill="currentColor"
                    />
                </svg>
            }
        </div>
        <app-button customClass="btn-default" (action)="switchView()">
            @if (contentType === 'movie') {
                <i class="fa-solid fa-film"></i>
            } @else {
                <i class="fa-solid fa-laptop"></i>
            }
        </app-button>
    </div>
    <div class="results-grid" #gridResults>
        @for (result of searchResults; track result.apiId) {
            @if (result.mediaCollectionInfos['poster_path']) {
                <app-card
                    class="results-grid-item"
                    [contentType]="contentType"
                    [info]="result"
                    view="search"
                    (showDetails)="handleShowDetails($event)"
                    >{{ result.id }}</app-card
                >
            }
        } @empty {
            @if (noResults) {
                <p class="results-grid-empty">Aucun résultats</p>
            }
        }
    </div>
</main>

@if (showDetailsPopup) {
    <app-item-popup-details
        [view]="'search'"
        [contentType]="contentType"
        [itemInfos]="selectedInfo"
        [animateOnInit]="animatePopupDetails"
        (close)="closeDetailsPopup()"
        (addedToCollection)="onMediaAddedToWatchlist()"
        (updating)="handleUpdate()"
    ></app-item-popup-details>
}
