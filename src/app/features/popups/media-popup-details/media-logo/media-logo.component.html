@let mediaDetails = this.mediaDetails();
<div class="media-logo">
    @if (mediaDetails.logo) {
        <img
            class="media-logo-image"
            [src]="`${TMDB_IMG_BASE_URL}/w500${mediaDetails.logo.path}`"
            alt=""
        />
    } @else {
        <h1 class="media-logo-text">
            {{ mediaDetails.title }}
        </h1>
    }
</div>
